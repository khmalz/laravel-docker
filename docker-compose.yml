services:
    php:
        build:
            context: ./
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html
            - ./vendor:/var/www/html/vendor
        ports:
            - "8000:80"
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            REDIS_HOST: redis
            REDIS_CLIENT: phpredis
        user: root
        networks:
            - laravel-network
        depends_on:
            - postgres
            - redis

    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: laravel-docker
            POSTGRES_USER: laravel
            POSTGRES_PASSWORD: secret
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U laravel -d laravel-docker"]
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - laravel-network

    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        networks:
            - laravel-network

volumes:
    postgres_data:
    redis_data:

networks:
    laravel-network:
        driver: bridge
